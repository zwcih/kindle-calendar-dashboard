# Copy to config.local.conf locally; never commit the filled file.
# UTF-8 without BOM, LF endings, literal KEY=value (no shell quoting).
# IMAGE_URL: selected HTTPS PNG endpoint; no credentials in authority.
# WIFI_SSID: exact name of a network already saved on the Kindle.
# IMAGE_MODE: static (GET, default if omitted) or dynamic (authenticated POST).
# Dynamic requires image-auth.local.conf; no fallback to GET on failure.
IMAGE_URL=
WIFI_SSID=
IMAGE_MODE=static
